<p-confirmdialog />

<div class="dashboard-header">
  <div class="header-info">
    <h1>Gestión de empresas</h1>
    <p>Empresas registradas en la plataforma</p>
  </div>
</div>

<div class="toolbar">
  <input
    pInputText
    type="text"
    placeholder="Buscar por nombre, RUC o correo..."
    [ngModel]="busqueda()"
    (ngModelChange)="busqueda.set($event)"
    class="search-input"
  />

  <p-select
    [options]="estadosOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Filtrar por estado"
    [ngModel]="estadoFiltro()"
    (ngModelChange)="estadoFiltro.set($event)"
    [showClear]="true"
    class="estado-select"
  />
</div>

<div class="table-card">
  <p-table
    [value]="empresasFiltradas()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Empresa</th>
        <th>RUC</th>
        <th>Correo</th>
        <th>Estado</th>
        <th style="width: 160px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-empresa>
      <tr>
        <td>
          <div class="empresa-cell">
            <div class="avatar">{{ empresa.nombreEmpresa.slice(0, 2).toUpperCase() }}</div>
            <div>
              <strong>{{ empresa.nombreEmpresa }}</strong>
              <span>{{ empresa.razonSocial }}</span>
            </div>
          </div>
        </td>
        <td>{{ empresa.ruc }}</td>
        <td>{{ empresa.usuarioEmail }}</td>
        <td>
          <p-tag [value]="empresa.estadoValidacion" [severity]="severidadEstado(empresa.estadoValidacion)" />
        </td>
        <td>
          <div class="acciones">
            <a [routerLink]="['/dashboard/admin/empresas', empresa.id]" pButton class="p-button-text" title="Ver / editar">
              <i class="pi pi-pencil"></i>
            </a>
            <button pButton class="p-button-text p-button-danger" title="Eliminar" (click)="confirmarEliminar(empresa)">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">No se encontraron empresas con esos filtros.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
