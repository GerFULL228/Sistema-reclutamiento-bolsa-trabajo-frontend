<p-confirmdialog />

<div class="dashboard-header">
    <div class="header-info">
        <h1>Gestión de CVs</h1>
        <p>Currículums registrados por los postulantes</p>
    </div>
</div>

<div class="toolbar">
    <input pInputText type="text" placeholder="Buscar por título, nombre o teléfono..." [ngModel]="busqueda()"
        (ngModelChange)="busqueda.set($event)" class="search-input" />
</div>

<div class="table-card">
    <p-table [value]="cvsFiltrados()" [loading]="loading()" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50]" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th>Título profesional</th>
                <th>Postulante</th>
                <th>Teléfono</th>
                <th>LinkedIn</th>
                <th style="width: 120px">Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-cv>
            <tr>
                <td>{{ cv.tituloProfesional }}</td>
                <td>{{ cv.nombreUsuario }}</td>
                <td>{{ cv.telefono || '—' }}</td>
                <td>{{ cv.linkedin || '—' }}</td>
                <td>
                    <div class="acciones">
                        <a [routerLink]="['/dashboard/admin/cv', cv.id]" pButton class="p-button-text"
                            title="Ver / editar">
                            <i class="pi pi-pencil"></i>
                        </a>
                        <button pButton class="p-button-text p-button-danger" title="Eliminar"
                            (click)="confirmarEliminar(cv)">
                            <i class="pi pi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="empty">Todavía no hay CVs registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
