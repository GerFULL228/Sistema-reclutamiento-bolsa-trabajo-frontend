<div class="company-container">
  <div class="company-card">

    <h1>Editar Perfil de Empresa</h1>
    <p>Actualiza la información de tu empresa.</p>

    <form>

      <div class="row">

        <div class="form-group">
          <label>Nombre de la empresa</label>
          <input type="text" value="Tech Solutions SAC">
        </div>

        <div class="form-group">
          <label>RUC</label>
          <input type="text" value="20123456789">
        </div>

      </div>

      <div class="form-group">
        <label>Correo corporativo</label>
        <input type="email" value="empresa@gmail.com">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" value="987654321">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" value="Av. Javier Prado 123">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea rows="5">Empresa dedicada al desarrollo de software.</textarea>
      </div>

      <button>
        Actualizar Perfil
      </button>

    </form>

  </div>
</div>
