<div class="company-container">
  <div class="company-card">

    <h1>Crear Perfil de Empresa</h1>
    <p>Completa la información para registrar tu empresa.</p>

    <form>

      <div class="row">

        <div class="form-group">
          <label>Nombre de la empresa</label>
          <input type="text" placeholder="Ej. Tech Solutions SAC">
        </div>

        <div class="form-group">
          <label>RUC</label>
          <input type="text" placeholder="20123456789">
        </div>

      </div>

      <div class="form-group">
        <label>Correo corporativo</label>
        <input type="email" placeholder="empresa@correo.com">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" placeholder="987654321">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" placeholder="Av. Javier Prado 123">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea rows="5" placeholder="Describe la empresa..."></textarea>
      </div>

      <button>
        Guardar Perfil
      </button>

    </form>

  </div>
</div>
